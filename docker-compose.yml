services:
  discovery-server:
    build:
      context: .
      dockerfile: infra/discovery-server/Dockerfile
    ports:
      - "8761:8761"
    environment:
      EUREKA_INSTANCE_HOSTNAME: discovery-server

  config-server:
    build:
      context: .
      dockerfile: infra/config-server/Dockerfile
    depends_on:
      discovery-server:
        condition: service_started
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config
    volumes:
      - ./infra/config-server/src/main/resources/config:/config:ro

  collector:
    restart: on-failure
    build:
      context: .
      dockerfile: stats-service/collector/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      config-server:
        condition: service_started
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  aggregator:
    restart: on-failure
    build:
      context: .
      dockerfile: stats-service/aggregator/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      config-server:
        condition: service_started
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  analyzer:
    restart: on-failure
    build:
      context: .
      dockerfile: stats-service/analyzer/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      recommendations-db:
        condition: service_healthy
      config-server:
        condition: service_started
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://recommendations-db:5432/recommendations
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-storage:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic stats.user-actions.v1 --partitions 1 --replication-factor 1 --config retention.ms=-1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic stats.events-similarity.v1 --partitions 1 --replication-factor 1 --config retention.ms=-1

  recommendations-db:
    image: postgres:17
    ports:
      - "6541:5432"
    environment:
      POSTGRES_DB: recommendations
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - recommendations-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d recommendations" ]
      interval: 5s
      timeout: 5s
      retries: 10

  events-db:
    image: postgres:17
    ports:
      - "6542:5432"
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - events-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d events" ]
      interval: 5s
      timeout: 5s
      retries: 10

  users-db:
    image: postgres:17
    ports:
      - "6543:5432"
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d users" ]
      interval: 5s
      timeout: 5s
      retries: 10

  requests-db:
    image: postgres:17
    ports:
      - "6544:5432"
    environment:
      POSTGRES_DB: requests
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - requests-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d requests" ]
      interval: 5s
      timeout: 5s
      retries: 10

  comments-db:
    image: postgres:17
    ports:
      - "6545:5432"
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - comments-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d comments" ]
      interval: 5s
      timeout: 5s
      retries: 10

  event-service:
    restart: on-failure
    build:
      context: .
      dockerfile: core/event-service/Dockerfile
    depends_on:
      events-db:
        condition: service_healthy
      config-server:
        condition: service_started
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://events-db:5432/events
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  user-service:
    restart: on-failure
    build:
      context: .
      dockerfile: core/user-service/Dockerfile
    depends_on:
      users-db:
        condition: service_healthy
      config-server:
        condition: service_started
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://users-db:5432/users
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  request-service:
    restart: on-failure
    build:
      context: .
      dockerfile: core/request-service/Dockerfile
    depends_on:
      requests-db:
        condition: service_healthy
      config-server:
        condition: service_started
      event-service:
        condition: service_started
      user-service:
        condition: service_started
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://requests-db:5432/requests
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  comment-service:
    restart: on-failure
    build:
      context: .
      dockerfile: core/comment-service/Dockerfile
    depends_on:
      comments-db:
        condition: service_healthy
      config-server:
        condition: service_started
      event-service:
        condition: service_started
      user-service:
        condition: service_started
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://comments-db:5432/comments
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  gateway-server:
    restart: on-failure
    build:
      context: .
      dockerfile: infra/gateway-server/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_started
      event-service:
        condition: service_started
      user-service:
        condition: service_started
      request-service:
        condition: service_started
      comment-service:
        condition: service_started
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"

volumes:
  kafka-storage:
  recommendations-db-data:
  events-db-data:
  users-db-data:
  requests-db-data:
  comments-db-data:
