services:
  discovery-server:
    build:
      context: .
      dockerfile: infra/discovery-server/Dockerfile
    ports:
      - "8761:8761"
    environment:
      EUREKA_INSTANCE_HOSTNAME: discovery-server

  config-server:
    build:
      context: .
      dockerfile: infra/config-server/Dockerfile
    depends_on:
      discovery-server:
        condition: service_started
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"

  stats-server:
    build:
      context: .
      dockerfile: stats-service/stats-server/Dockerfile
    depends_on:
      stats-db:
        condition: service_healthy
      config-server:
        condition: service_started
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/stats
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  stats-db:
    image: postgres:17
    ports:
      - "6541:5432"
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - stats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d stats" ]
      interval: 5s
      timeout: 5s
      retries: 10

  ewm-db:
    image: postgres:17
    ports:
      - "6542:5432"
    environment:
      POSTGRES_DB: ewm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ewm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ewm" ]
      interval: 5s
      timeout: 5s
      retries: 10

  main-service:
    build:
      context: .
      dockerfile: core/main-service/Dockerfile
    depends_on:
      ewm-db:
        condition: service_healthy
      config-server:
        condition: service_started
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://ewm-db:5432/ewm
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  gateway-server:
    build:
      context: .
      dockerfile: infra/gateway-server/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_started
      main-service:
        condition: service_started
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"

volumes:
  stats-db-data:
  ewm-db-data:
